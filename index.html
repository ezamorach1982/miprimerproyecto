<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Interactiva</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calculator">
    <div class="display">
      <div class="display-previous" id="previousOperand"></div>
      <div class="display-current" id="currentOperand">0</div>
    </div>

    <div class="keys">
      <button class="key key-action" data-action="clear">AC</button>
      <button class="key key-action" data-action="delete">DEL</button>
      <button class="key key-action" data-action="percent">%</button>
      <button class="key key-operator" data-operator="/">÷</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key key-operator" data-operator="*">×</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key key-operator" data-operator="-">−</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key key-operator" data-operator="+">+</button>

      <button class="key key-zero" data-number="0">0</button>
      <button class="key" data-number=".">.</button>
      <button class="key key-equals" data-action="equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
